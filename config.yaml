# rag-mcp-server 配置文件
# 说明：所有相对路径都按「本文件所在目录」解析，因此进程的工作目录不影响行为。

knowledge_base:
  # 支持：单个 .json（[{"text": ..., "source": ...}, ...]）/ 目录（.txt/.md/.json）/ 单个 .txt
  path: "./data/sample/knowledge_base.json"
  # 也可以直接指向同源平台的数据文件（格式一致，无需改动代码）：
  # path: "../rag-eval-platform/data/sample/knowledge_base.json"

chunking:
  strategy: "fixed_size"   # 本仓库只移植了固定窗口切分（原平台另有 recursive / semantic）
  chunk_size: 512          # 字符数：一个 chunk 覆盖一段完整技术要点
  chunk_overlap: 50        # 重叠字符数：防止关键句被切在窗口边界上

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"   # 中文小模型，512 维
  device: "auto"           # auto（有 GPU 用 GPU，否则 CPU）| cpu | cuda
  batch_size: 64
  cache_dir: "./data/embedding_cache"    # 文本 MD5 缓存：内容不变不重算
  offline: true            # 模型已在本机缓存 → 禁止联网，完全离线可复现

retrieval:
  top_k: 3                 # 默认返回条数
  similarity_threshold: 0.3  # 余弦相似度低于此值的内容不返回（宁可不答，不喂噪音）
  max_top_k: 10            # top_k 硬上限：约束单次调用注入模型上下文的最大长度

server:
  name: "rag-mcp-server"
  version: "0.1.0"
  warmup: true             # 启动时预热索引（把首调用延迟挪到启动阶段）
  log_level: "INFO"        # 日志走 stderr，不污染 stdio 协议通道

  # ===== 传输方式：stdio | streamable-http | sse =====
  # stdio：默认。由 MCP 客户端拉起子进程，Claude Desktop / Cursor 本地接入。
  # streamable-http：推荐远程/多客户端，端点 /mcp，支持会话与流式。
  # sse：旧版 HTTP 传输（/sse + /messages/），仅为兼容旧客户端保留。
  # 提示：命令行 --transport/--host/--port 优先级高于本文件；环境变量 RAG_MCP_TRANSPORT/HOST/PORT 次之。
  transport: "stdio"
  host: "127.0.0.1"        # 对外提供服务时改 "0.0.0.0"（务必配合鉴权/反向代理，见 README）
  port: 8000
  streamable_http_path: "/mcp"
  sse_path: "/sse"
  message_path: "/messages/"
  stateless_http: false    # true = 不保存会话状态（多实例 / 负载均衡部署时开启）
  json_response: false     # true = streamable-http 返回普通 JSON（便于 curl 调试）
  # DNS rebinding 防护：留空 = SDK 默认（仅 localhost 自动开启）；
  # 对外暴露到域名/IP 时建议显式配置，否则可能被 Host/Origin 校验拒绝（421）。
  allowed_hosts: []        # 例：["127.0.0.1:*", "rag.example.com"]
  allowed_origins: []      # 例：["http://localhost:*", "https://rag.example.com"]

  # ===== 安全层（只作用于 HTTP 传输；stdio 是父子进程模式，不受鉴权/限流影响）=====
  auth:
    enabled: false         # true = 校验 Authorization: Bearer <token>；首行之外一律 401
    token: ""              # 建议留空，改用环境变量 RAG_MCP_AUTH_TOKEN（设置了它即自动启用鉴权）
  rate_limit:
    rps: 0                 # 令牌桶速率（每秒补充多少请求）；<=0 = 关闭（默认关闭，见 README §5.6.2）
    burst: 0               # 桶容量（允许的突发量）；<=0 时取 ceil(rps)
  # 不鉴权、不限流的路径：健康检查与指标采集必须无需凭证即可访问（k8s 探针 / Prometheus）
  security_exempt_paths: ["/healthz", "/metrics"]
